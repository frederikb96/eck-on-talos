# =============================================================================
# eck-stack Helm values — the complete Elastic Stack for this guide
# =============================================================================
#
# This file is a single Helm values file that the `eck-stack` umbrella chart
# fans out into four Elastic custom resources:
#
#   eck-elasticsearch   → kind: Elasticsearch (a 3-node StatefulSet)
#   eck-kibana          → kind: Kibana        (2 replicas, Deployment)
#   eck-fleet-server    → kind: Agent (Fleet Server mode, 2 replicas)
#   eck-agent           → kind: Agent (Fleet mode, DaemonSet)
#
# All four are declarative. You change a field here, run `helm upgrade`,
# and the ECK operator reconciles the cluster state. No `kubectl edit`,
# no manual rolling restarts, no certificate renewal ceremonies.
#
# Chart reference:
#   https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-install-helm.html
#
# IMPORTANT: PLACEHOLDERS that get filled in before deploying. The README's
# "Set your cluster variables" block runs a sed pass that replaces all of these
# automatically — you never edit them by hand:
#   __NODE1_IP__      → your node1 IP (public on cloud VMs, LAN on bare metal)
#   __NODE2_IP__      → your node2 IP
#   __NODE3_IP__      → your node3 IP
#   elastic.lan       → your DNS name for Elasticsearch (or delete the entry)
#   kibana.lan        → your DNS name for Kibana (or delete the entry)
#   fleet.lan         → your DNS name for Fleet Server (or delete the entry)
#
# These end up as SubjectAltName (SAN) entries on the TLS certificates ECK
# signs with your internal CA. If they don't match the hostname your clients
# use, TLS validation will fail.
# =============================================================================

---
# =============================================================================
# ELASTICSEARCH — the 3-node StatefulSet storing all your data
# =============================================================================
eck-elasticsearch:
  # The Elastic Stack version. "# managed by renovate" tells Renovate bot to
  # bump this automatically when a new Elastic version is published. The four
  # version fields (ES, Kibana, Fleet Server, Agent) MUST stay in sync.
  version: 9.3.8 # managed by renovate
  enabled: true

  # Force the resulting Elasticsearch resource to be named "elasticsearch"
  # instead of whatever Helm would auto-generate. Every other ref in this file
  # uses "name: elasticsearch" to point at it, so this must stay set.
  fullnameOverride: elasticsearch

  # -------------------------------------------------------------------------
  # Stack Monitoring (self-monitoring)
  # -------------------------------------------------------------------------
  # ECK deploys a Metricbeat + Filebeat sidecar in each ES pod that ships
  # metrics and logs to ANOTHER Elasticsearch cluster. Here we point it at
  # ourselves (elasticsearchRefs: name: elasticsearch), which is "self
  # monitoring". The official Elastic recommendation is a dedicated
  # monitoring cluster, but for a small single-cluster deployment this is
  # the pragmatic choice: zero extra infrastructure, still get the full
  # Stack Monitoring UI in Kibana.
  #
  # Docs: https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-stack-monitoring.html
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: elasticsearch
    logs:
      elasticsearchRefs:
        - name: elasticsearch

  # -------------------------------------------------------------------------
  # HTTP layer: NodePort + TLS with your internal CA
  # -------------------------------------------------------------------------
  http:
    # Override the default ClusterIP service with a NodePort. NodePort means
    # every node in the cluster listens on port 30920 and forwards to the
    # Elasticsearch pods. Clients on the LAN can hit ANY node's IP and reach
    # the service, giving you de-facto HA with zero extra components.
    #
    # If you want a proper LoadBalancer instead (cloud environments), change
    # type: NodePort to type: LoadBalancer — ECK/Kubernetes does the rest.
    service:
      spec:
        type: NodePort
        ports:
          - name: https
            port: 9200
            targetPort: 9200
            nodePort: 30920

    # TLS: "bring your own CA". When we give ECK a Secret containing BOTH
    # ca.crt AND ca.key, it uses that CA to sign fresh leaf certificates
    # for every component. One CA → all three services (ES, Kibana, Fleet
    # Server) serve certs signed by the same authority → clients trust
    # ONE ca.crt and everything works.
    #
    # Docs: https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-tls-certificates.html
    #
    # The `eck-ca` Secret is created in Step 8 of the README with:
    #   kubectl -n elastic-stack create secret generic eck-ca \
    #     --from-file=ca.crt=ca/ca.crt \
    #     --from-file=ca.key=ca/ca.key
    tls:
      certificate:
        secretName: eck-ca

      # selfSignedCertificate.subjectAltNames adds custom SANs to the leaf
      # certificate ECK generates. Because we're supplying a CA (above),
      # ECK still signs a per-component leaf cert — it just uses YOUR CA
      # as the signer and merges these SANs into the cert.
      #
      # Replace the IPs and DNS names with your actual node addresses.
      # If a client connects to `https://<ip>:30920/` and that IP is not
      # in this list, the TLS handshake fails with a hostname mismatch.
      selfSignedCertificate:
        subjectAltNames:
          - ip: __NODE1_IP__
          - ip: __NODE2_IP__
          - ip: __NODE3_IP__
          - dns: elastic.lan

  # -------------------------------------------------------------------------
  # NodeSets — the actual Elasticsearch processes
  # -------------------------------------------------------------------------
  # Elasticsearch node groups in ECK are called "nodeSets". Each nodeSet
  # becomes a StatefulSet. With count: 3 and one nodeSet, you get 3
  # Elasticsearch pods, each with its own persistent volume.
  nodeSets:
    - name: default
      count: 3

      config:
        # node.roles — what each Elasticsearch node does. We give every
        # node ALL the main roles so the cluster is homogeneous:
        #   master                - participates in cluster coordination
        #                           and holds the cluster state
        #   data                  - stores shards (the actual data)
        #   ingest                - runs ingest pipelines
        #   ml                    - runs Machine Learning jobs
        #   transform             - runs transform jobs
        #   remote_cluster_client - enables CCR / CCS to other clusters
        #
        # Docs: https://www.elastic.co/guide/en/elasticsearch/reference/current/node-roles-overview.html
        #
        # This is the right setup for a small cluster. If you grow past
        # ~7 data nodes, split out dedicated master nodes.
        node.roles: ["master", "data", "ingest", "ml", "transform", "remote_cluster_client"]

        # Turn OFF the legacy Elasticsearch self-monitoring collector —
        # we use Metricbeat-based stack monitoring (configured above via
        # spec.monitoring) instead. If both were on you'd get duplicate
        # metrics. Setting this false is the official recommendation when
        # using Metricbeat monitoring.
        xpack.monitoring.collection.enabled: false

        # -------------------------------------------------------------------
        # Audit logging
        # -------------------------------------------------------------------
        # Audit logging is a paid feature and is OFF by default here so
        # Basic-license clusters don't emit a startup warning about it.
        # To turn it on, follow Maintenance → "Enabling audit logs" in
        # the README — it shows the exact snippet to paste in place of
        # this block plus the one-time license activation.
        xpack.security.audit.enabled: false

      podTemplate:
        spec:
          # -----------------------------------------------------------------
          # Pod anti-affinity: one ES pod per node
          # -----------------------------------------------------------------
          # requiredDuringSchedulingIgnoredDuringExecution with
          # topologyKey: kubernetes.io/hostname enforces that NO TWO
          # Elasticsearch pods can ever schedule on the same Kubernetes
          # node. With count: 3 on a 3-node cluster, that means exactly
          # one ES pod per node.
          #
          # Docs: https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-advanced-node-scheduling.html
          #
          # Combined with the local PVs pinned to hostnames (see
          # kubernetes/storage/pvs.yaml), this gives us true data locality:
          # each ES pod lives on the same node as its on-disk data.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      common.k8s.elastic.co/type: elasticsearch
                  topologyKey: kubernetes.io/hostname

          # fsGroup: 1000 tells the kubelet to chown the mounted PVC to
          # GID 1000, which is the GID Elasticsearch runs as inside the
          # container. Without this, the first container boot fails with
          # "permission denied" on the data directory.
          securityContext:
            fsGroup: 1000

          # -----------------------------------------------------------------
          # Init container: raise vm.max_map_count
          # -----------------------------------------------------------------
          # Elasticsearch uses memory-mapped files (mmap) heavily for its
          # Lucene segments. The Linux default of 65530 memory maps is
          # way too small — ES will fail to start with a
          # "max virtual memory areas vm.max_map_count [65530] is too low"
          # error. The kernel supports up to 262144 on most modern systems.
          #
          # Docs: https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-virtual-memory.html
          #
          # We fix it with a privileged init container that runs sysctl
          # once before the main container starts. This is a standard ECK
          # pattern. The init container is `runAsUser: 0` + privileged
          # because only root can write to /proc/sys/vm/max_map_count, and
          # this is WHY the elastic-stack namespace needs the privileged
          # Pod Security Standards label.
          initContainers:
            - name: sysctl
              securityContext:
                privileged: true
                runAsUser: 0
              command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]

          containers:
            - name: elasticsearch
              # --------------------------------------------------------
              # Resources — Elasticsearch is special: request == limit
              # --------------------------------------------------------
              # For most workloads you set a request (floor) and leave
              # the limit unset so the pod can burst. Elasticsearch is
              # DIFFERENT. The JVM pre-allocates its heap at startup,
              # Lucene's off-heap file cache needs stable memory, and
              # the OOM killer must never touch the JVM. Solution:
              # request == limit → Kubernetes gives the pod "Guaranteed"
              # QoS and reserves that exact amount, safe from reclaim.
              #
              # Docs: https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-managing-compute-resources.html
              #
              # We do NOT set ES_JAVA_OPTS here. Starting with ES 7.11
              # the Elasticsearch container auto-sizes the JVM heap from
              # its own cgroup memory limit (roughly 50% of the limit,
              # with an upper bound around 30 GiB due to compressed oops).
              # That means: set resources.limits.memory here → heap is
              # sized correctly, no env var needed. One less moving part.
              #
              # Sizing: 8 GiB is the default for a 16 GiB VM. See the
              # "Sizing your VMs" section in README.md for bigger nodes.
              # CPU is intentionally low — ES idles at nearly 0 millicore
              # and bursts freely without a limit.
              resources:
                requests:
                  cpu: 100m
                  memory: 8Gi
                limits:
                  memory: 8Gi

      # ---------------------------------------------------------------------
      # Persistent storage — bind to the local PVs we pre-created
      # ---------------------------------------------------------------------
      # volumeClaimTemplates works like a StatefulSet's volumeClaimTemplates:
      # each of the 3 ES pods gets its own PVC named
      # "elasticsearch-data-elasticsearch-es-default-<N>". The PVCs request
      # 100 GiB from the `local-storage` StorageClass, which is a
      # no-provisioner class — so the PVCs can only bind to one of the
      # three PVs we pre-created in kubernetes/storage/pvs.yaml.
      #
      # Each of those PVs has a nodeAffinity pinning it to a specific node
      # (node1/node2/node3), so the scheduler places each ES pod on the
      # node that holds its PV's data directory — automatic data locality.
      #
      # Docs: https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-volume-claim-templates.html
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 100Gi
            storageClassName: local-storage

---
# =============================================================================
# KIBANA — the web UI and Fleet control plane
# =============================================================================
eck-kibana:
  version: 9.3.8 # managed by renovate
  enabled: true
  fullnameOverride: kibana

  # Two Kibana replicas. With the podAntiAffinity below they land on two
  # of the three nodes. Two replicas is enough: Kibana is stateless, and
  # if one pod dies the other keeps serving.
  count: 2

  # Point Kibana at our Elasticsearch (same name as fullnameOverride in
  # the eck-elasticsearch section above). ECK auto-generates a kibana_system
  # user, TLS trust and a service account for this link.
  elasticsearchRef:
    name: elasticsearch

  # Same self-monitoring pattern as Elasticsearch: Kibana ships its own
  # metrics and logs back into the cluster it's serving.
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: elasticsearch
    logs:
      elasticsearchRefs:
        - name: elasticsearch

  http:
    # NodePort 30601 — Kibana's native port is 5601. Access via any node IP.
    service:
      spec:
        type: NodePort
        ports:
          - name: https
            port: 5601
            targetPort: 5601
            nodePort: 30601

    # Same BYO CA pattern as Elasticsearch. Clients that trust ca.crt will
    # also trust Kibana's cert, since ECK signs it with the same CA.
    tls:
      certificate:
        secretName: eck-ca
      selfSignedCertificate:
        subjectAltNames:
          - ip: __NODE1_IP__
          - ip: __NODE2_IP__
          - ip: __NODE3_IP__
          - dns: kibana.lan

  # -------------------------------------------------------------------------
  # Kibana configuration (kibana.yml)
  # -------------------------------------------------------------------------
  config:
    # The external URL users type in the browser (and that Fleet's callback
    # URLs get baked into). In production point this at your load balancer /
    # ingress DNS name (e.g. https://kibana.example.com). For a LAN / test
    # setup, pointing it at one node's NodePort URL is fine — Kibana only
    # uses this value for things like Fleet enrollment callbacks and
    # generated links in emails/reports, NOT for the actual HTTP listener.
    #
    # Docs: https://www.elastic.co/guide/en/kibana/current/settings.html#server-publicBaseUrl
    server.publicBaseUrl: "https://__NODE1_IP__:30601"

    # Allow Kibana to show Cross-Cluster Search monitoring data. Harmless
    # if you don't use CCS.
    monitoring.ui.ccs.enabled: true

    # -----------------------------------------------------------------------
    # Kibana audit logging
    # -----------------------------------------------------------------------
    # Off by default for the same reason as the Elasticsearch side.
    # See Maintenance → "Enabling audit logs" in the README for the
    # snippet to paste in place of this block.
    xpack.security.audit.enabled: false

    # -----------------------------------------------------------------------
    # Kibana Fleet preconfiguration — wire up Fleet Server + Agent policies
    # -----------------------------------------------------------------------
    # Kibana hosts the Fleet control plane. Everything Fleet knows about
    # (outputs, Fleet Server hosts, agent policies, integrations) can be
    # DECLARED in kibana.yml so Fleet boots with a working config.
    #
    # Docs: https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-elastic-agent-fleet-configuration.html
    #
    # Without this block, Fleet starts empty and every policy has to be
    # clicked together in the Kibana UI. With this block, it's declarative.

    # -----------------------------------------------------------------
    # Fleet outputs — TWO of them, for two very different audiences
    # -----------------------------------------------------------------
    # We declare two Elasticsearch outputs side by side:
    #
    #   external-es    → lists all three node IPs on the NodePort.
    #                    Marked `is_default: true` AND `is_default_
    #                    monitoring: true` — this is what every newly
    #                    enrolled agent gets by default (in-cluster OR
    #                    external). When an agent sees multiple hosts,
    #                    it picks one randomly and fails over to the
    #                    others if that one becomes unreachable, so we
    #                    get de-facto HA across all three nodes without
    #                    any external load balancer.
    #
    #   kubernetes-es  → points at the IN-CLUSTER .svc DNS name.
    #                    Kept around for edge cases where an operator
    #                    wants to pin a specific policy to in-cluster
    #                    traffic only (slightly lower latency, never
    #                    leaves the Kubernetes network). Not the
    #                    default — agents only use it when a policy
    #                    explicitly references `id: kubernetes-es`.
    #
    # The three __NODE<N>_IP__ placeholders are filled in by the README's
    # sed pass. They must also be in the subjectAltNames block of the
    # Elasticsearch CR above (they are — the same three placeholders
    # appear in both places).
    #
    # Optional: add a DNS name in addition to (or instead of) the IPs.
    # E.g. add "https://elastic.lan:30920" as a fourth entry, point
    # elastic.lan in your internal DNS at a NodePort load balancer or
    # just one of the nodes, and the agent will prefer it. The DNS
    # name also needs to be in the subjectAltNames of the ES CR.
    xpack.fleet.outputs:
      - id: external-es
        name: External ES (NodePort HA)
        type: elasticsearch
        hosts:
          - "https://__NODE1_IP__:30920"
          - "https://__NODE2_IP__:30920"
          - "https://__NODE3_IP__:30920"
        is_default: true
        is_default_monitoring: true
      - id: kubernetes-es
        name: Kubernetes ES (in-cluster)
        type: elasticsearch
        hosts: ["https://elasticsearch-es-http.elastic-stack.svc:9200"]

    # Same pattern for Fleet Server: primary host entry lists all three
    # node IPs on the Fleet Server NodePort, marked is_default so newly
    # enrolled agents receive all three and can fail over between them.
    # An in-cluster .svc entry is kept around for edge cases but isn't
    # the default.
    #
    # As with the ES output above, you can optionally add a DNS name
    # (e.g. https://fleet.lan:30822) as an additional host_urls entry.
    xpack.fleet.fleetServerHosts:
      - id: external-fleet
        name: External Fleet (NodePort HA)
        host_urls:
          - "https://__NODE1_IP__:30822"
          - "https://__NODE2_IP__:30822"
          - "https://__NODE3_IP__:30822"
        is_default: true
      - id: kubernetes-fleet
        name: Kubernetes Fleet (in-cluster)
        host_urls: ["https://fleet-server-agent-http.elastic-stack.svc:8220"]

    # Integration packages Kibana should install on startup. These become
    # available in the Fleet "Integrations" catalogue so agent policies
    # can reference them.
    xpack.fleet.packages:
      - name: system        # host-level metrics + logs (CPU, memory, disk)
        version: latest
      - name: elastic_agent # the agent's own self-telemetry
        version: latest
      - name: fleet_server  # the Fleet Server integration
        version: latest
      - name: kubernetes    # k8s cluster observability (pods, nodes, containers)
        version: latest

    # Pre-create two agent policies:
    #
    #   eck-fleet-server → the Fleet Server pods themselves use this policy
    #   eck-agent        → the DaemonSet agents use this policy and collect
    #                      host + Kubernetes metrics
    #
    # The IDs here (eck-fleet-server / eck-agent) are referenced from the
    # Agent CRs further down via policyID:
    # Neither policy pins a `data_output_id` / `monitoring_output_id` — both
    # inherit the default output from xpack.fleet.outputs above. Per-policy
    # outputs (one output for in-cluster agents, a different one for external)
    # is a Platinum feature. See the "Multiple Fleet outputs" section in the
    # README Maintenance chapter for the split-output recipe if you ever
    # upgrade.
    xpack.fleet.agentPolicies:
      - name: Fleet Server on ECK policy
        id: eck-fleet-server
        fleet_server_host_id: kubernetes-fleet
        namespace: default
        is_managed: true
        is_default_fleet_server: true
        monitoring_enabled: [logs, metrics]
        unenroll_timeout: 900
        package_policies:
          - name: fleet_server-1
            id: fleet_server-1
            package:
              name: fleet_server

      - name: Elastic Agent on ECK policy
        id: eck-agent
        fleet_server_host_id: kubernetes-fleet
        namespace: default
        monitoring_enabled: [logs, metrics]
        unenroll_timeout: 900
        is_managed: false
        package_policies:
          - name: system-1
            package:
              name: system
          - name: kubernetes-1
            package:
              name: kubernetes

  # -------------------------------------------------------------------------
  # Kibana podTemplate — anti-affinity + resources
  # -------------------------------------------------------------------------
  podTemplate:
    spec:
      # Same anti-affinity pattern as Elasticsearch: force the two Kibana
      # pods onto different nodes so a single node outage can't take both
      # down. With count: 2 on 3 nodes, that leaves one node free.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  common.k8s.elastic.co/type: kibana
              topologyKey: kubernetes.io/hostname
      containers:
        - name: kibana
          # No memory limit on Kibana. The request (1 GiB) is enough
          # for a small team; if Kibana ever needs more (big saved-object
          # migration, many concurrent users) it can burst freely into
          # whatever memory the node has spare. An unlimited pod will
          # never be OOM-killed before cgroup limits kick in — and we
          # don't have cgroup limits set here, on purpose.
          #
          # CPU request is deliberately tiny: Kibana idles at near-zero
          # CPU, only spikes when someone actually loads a dashboard.
          # No CPU limit either — let it burst.
          resources:
            requests:
              cpu: 10m
              memory: 1Gi

---
# =============================================================================
# FLEET SERVER — the agent control plane, runs as ECK "Agent" with mode: fleet
# =============================================================================
eck-fleet-server:
  version: 9.3.8 # managed by renovate
  enabled: true
  fullnameOverride: fleet-server

  # Ties Fleet Server to the Kibana we defined above. Fleet Server reads
  # its policies from Kibana's Fleet API, so it needs a reference to it.
  # ECK auto-generates the necessary credentials.
  kibanaRef:
    name: kibana

  # Fleet Server also needs direct access to Elasticsearch to write data.
  elasticsearchRefs:
    - name: elasticsearch

  # Apply the "eck-fleet-server" agent policy we pre-declared in Kibana
  # above. This is what makes Fleet Server self-configure on startup.
  policyID: eck-fleet-server

  http:
    # NodePort 30822 — Fleet Server's native port is 8220. External
    # Elastic Agents enroll against https://<node-ip>:30822.
    service:
      spec:
        type: NodePort
        ports:
          - name: https
            port: 8220
            targetPort: 8220
            nodePort: 30822

    # Same BYO CA + SANs pattern. External agents trust ca.crt when
    # enrolling via --certificate-authorities=ca.crt.
    tls:
      certificate:
        secretName: eck-ca
      selfSignedCertificate:
        subjectAltNames:
          - ip: __NODE1_IP__
          - ip: __NODE2_IP__
          - ip: __NODE3_IP__
          - dns: fleet.lan

  deployment:
    # 2 Fleet Server replicas for HA. Fleet Server is stateless (state
    # lives in Elasticsearch), so scaling horizontally is trivial.
    replicas: 2
    podTemplate:
      spec:
        # Fleet Server needs a ServiceAccount to read cluster resources
        # for its own self-telemetry. ECK auto-creates this — we just
        # name it here.
        serviceAccountName: fleet-server
        automountServiceAccountToken: true

        # Anti-affinity: two replicas on two different nodes.
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    agent.k8s.elastic.co/name: fleet-server
                topologyKey: kubernetes.io/hostname

        # hostPath volume for agent state cache. This is a local scratch
        # dir (checkin state, cached policies). If the pod reschedules
        # to another node, the cache is lost but Fleet Server rebuilds
        # it from Elasticsearch on startup — so it's safe.
        volumes:
          - name: agent-data
            hostPath:
              path: /var/lib/elastic-fleet-state
              type: DirectoryOrCreate

        containers:
          - name: agent
            securityContext:
              runAsUser: 0
              privileged: true
            # Same philosophy as Kibana: low request, no limit. Fleet
            # Server is stateless and lightweight — it mostly shuttles
            # agent check-ins between agents and Elasticsearch. Bursts
            # happen during mass enrollments.
            resources:
              requests:
                cpu: 10m
                memory: 1Gi

---
# =============================================================================
# ELASTIC AGENT DaemonSet — cluster + container observability on every node
# =============================================================================
# ECK deploys this as a kind: Agent with mode: fleet and as a DaemonSet,
# meaning one pod per Kubernetes node. Each pod enrolls itself with Fleet
# Server using the "eck-agent" policy, which gives it the System and
# Kubernetes integrations — so you get:
#
#   - Host metrics (CPU, memory, disk, network) for each node
#   - Container metrics and logs from every container on that node
#   - Kubernetes events, pod state, deployment state, etc.
#
# All visible in Kibana under "Observability → Kubernetes".
#
# Docs: https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-elastic-agent-fleet.html
# =============================================================================
eck-agent:
  version: 9.3.8 # managed by renovate
  enabled: true

  # Empty elasticsearchRefs — the agent doesn't talk to ES directly, it
  # goes through Fleet Server (fleetServerRef below). This is the "fleet"
  # mode of operation, as opposed to standalone mode where agents write
  # straight to ES.
  elasticsearchRefs: []

  kibanaRef:
    name: kibana
  fleetServerRef:
    name: fleet-server

  mode: fleet
  policyID: eck-agent

  # -------------------------------------------------------------------------
  # RBAC — what this agent is allowed to read from the Kubernetes API
  # -------------------------------------------------------------------------
  # The Kubernetes integration needs to list pods, nodes, namespaces etc.
  # to produce metrics. ECK creates the ServiceAccount and RoleBinding;
  # we just specify which rules the ClusterRole should have.
  #
  # The rules below are a union of:
  #   - https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-eck-permissions.html
  #   - https://github.com/elastic/cloud-on-k8s/blob/main/config/recipes/elastic-agent/kubernetes-integration.yaml
  #
  # We intentionally do NOT grant write access to anything — this agent
  # is read-only observability.
  clusterRole:
    name: elastic-agent
    rules:
      # Core resources for pod/node/namespace discovery and metrics.
      - apiGroups: [""]
        resources: [pods, nodes, namespaces, events, services, configmaps]
        verbs: [get, watch, list]

      # Leader election for the cluster-scoped state collector. Only one
      # agent at a time queries kube-state-metrics-style data to avoid
      # duplicates; the rest wait via a Lease object.
      - apiGroups: ["coordination.k8s.io"]
        resources: [leases]
        verbs: [get, create, update]

      # Per-node stats (CPU, memory, network) served by kubelet.
      - apiGroups: [""]
        resources: [nodes/stats]
        verbs: [get]

      # /metrics endpoint on kubelet itself.
      - nonResourceURLs: ["/metrics"]
        verbs: [get]

      # Workload state (deployments, statefulsets, etc.) — powers the
      # Kubernetes workload dashboards in Kibana.
      - apiGroups: ["apps"]
        resources: [statefulsets, deployments, replicasets, daemonsets]
        verbs: [get, list, watch]

      # Legacy extensions API (still needed on some Kubernetes versions
      # for ReplicaSets).
      - apiGroups: ["extensions"]
        resources: [replicasets]
        verbs: [get, list, watch]

      # Jobs + CronJobs for batch workload monitoring.
      - apiGroups: ["batch"]
        resources: [jobs, cronjobs]
        verbs: [get, list, watch]

      # StorageClass info (used by the Kubernetes integration to tag
      # volumes with their storage class).
      - apiGroups: ["storage.k8s.io"]
        resources: [storageclasses]
        verbs: [get, list, watch]

      # PV / PVC info for volume observability.
      - apiGroups: [""]
        resources: [persistentvolumes, persistentvolumeclaims]
        verbs: [get, list, watch]

  # -------------------------------------------------------------------------
  # DaemonSet podTemplate
  # -------------------------------------------------------------------------
  daemonSet:
    podTemplate:
      spec:
        # Service account matches the ClusterRole above.
        serviceAccountName: elastic-agent
        automountServiceAccountToken: true

        # hostNetwork: true so the agent can scrape the kubelet on the
        # node's real IP. dnsPolicy must be ClusterFirstWithHostNet when
        # you share the host network but still want cluster DNS.
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet

        # hostPath volumes — the agent needs to read container logs and
        # the container runtime state directly from the node filesystem.
        # These are standard for any DaemonSet doing log collection.
        volumes:
          - name: agent-data
            hostPath:
              path: /var/lib/elastic-agent-state
              type: DirectoryOrCreate
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
              type: Directory
          - name: varlibcontainerd
            hostPath:
              path: /var/lib/containerd
              type: Directory

        containers:
          - name: agent
            # runAsUser: 0 + privileged are required to read container
            # logs and access the container runtime socket. This is why
            # the elastic-stack namespace needs the privileged Pod
            # Security Standards label.
            securityContext:
              runAsUser: 0
              privileged: true
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlibcontainerd
                mountPath: /var/lib/containerd
                readOnly: true
            # No memory limit on the agent. Log collection can spike
            # when a chatty container dumps logs in a burst — a hard
            # limit would just OOM-kill the agent and lose lines.
            # Request 1 GiB for the steady-state footprint, let it
            # burst. Very low CPU request (10m) because the agent
            # idles when nothing is happening.
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
